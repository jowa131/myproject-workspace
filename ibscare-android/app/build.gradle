plugins {
    id "com.android.application"
}

android {
    namespace = "com.ibscare.android"
    compileSdk = 35

    defaultConfig {
        applicationId = "com.ibscare.android"
        minSdk = 26
        targetSdk = 35
        versionCode = 10
        versionName = "0.1.9"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig = true
    }
}

dependencies {
    testImplementation "junit:junit:4.13.2"
}

def debugArtifactVersionName = android.defaultConfig.versionName
def debugArtifactVersionCode = android.defaultConfig.versionCode
def versionedDebugApkName = "ibs-care-v${debugArtifactVersionName}-${debugArtifactVersionCode}-debug.apk"
def debugApk = layout.buildDirectory.file("outputs/apk/debug/app-debug.apk")
def versionedDebugApk = layout.buildDirectory.file("outputs/apk/debug/${versionedDebugApkName}")

tasks.register("copyVersionedDebugApk") {
    dependsOn("packageDebug")
    inputs.file(debugApk)
    outputs.file(versionedDebugApk)

    doLast {
        copy {
            from(debugApk)
            into(versionedDebugApk.get().asFile.parentFile)
            rename { versionedDebugApkName }
        }
    }
}

tasks.register("zipVersionedDebugApk", Zip) {
    dependsOn("copyVersionedDebugApk")
    archiveFileName.set("ibs-care-v${debugArtifactVersionName}-${debugArtifactVersionCode}-debug-apk.zip")
    destinationDirectory.set(rootProject.layout.projectDirectory)
    from(versionedDebugApk)
}

afterEvaluate {
    tasks.named("assembleDebug") {
        finalizedBy("zipVersionedDebugApk")
    }
}
